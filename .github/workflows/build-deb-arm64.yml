name: Build Debian Package (.deb) — ARM64

on:
  push:
    branches:
      - master
      - main
      - "ci/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Debian package version (e.g. 0.1.0)"
        type: string
        default: "0.1.0"

concurrency:
  group: build-deb-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-blockbench-bundle:
    name: Build Blockbench Web Bundle (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build & Compress Blockbench Web Bundle
        run: bash scripts/build_blockbench.sh

      - name: Upload Blockbench Vendor Bundle
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-web-vendor-arm64
          path: |
            assets/vendor/blockbench-web.tar.zst
            assets/vendor/blockbench-web.sha256
          retention-days: 7

  package-deb-arm64:
    name: Build & Verify pack-studio ARM64 .deb
    needs: build-blockbench-bundle
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download Blockbench Vendor Bundle
        uses: actions/download-artifact@v4
        with:
          name: blockbench-web-vendor-arm64
          path: assets/vendor

      - name: Install Linux ARM64 Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            dpkg-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libgl1-mesa-dev

      - name: Install Rust Stable (aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build (ARM64)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-arm64-deb"

      - name: Build pack-studio Release Binary (ARM64 + Embedded Blockbench)
        run: |
          cargo build -p pack-studio --release --features embed-blockbench
          ls -lh target/release/pack-studio
          file target/release/pack-studio

      - name: Build Debian Package (.deb) for arm64
        env:
          DEB_ARCH: arm64
          DEB_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          chmod +x scripts/build_deb_arm64.sh
          bash scripts/build_deb_arm64.sh target/release/pack-studio dist-deb

      - name: Verify .deb Installation via apt
        run: |
          DEB_FILE="$(ls dist-deb/pack-studio_*_arm64.deb | head -n 1)"
          dpkg-deb --contents "${DEB_FILE}"
          sudo apt-get install -y "./${DEB_FILE}"
          which pack-studio
          ls -lh /usr/bin/pack-studio /usr/share/applications/pack-studio.desktop

      - name: Upload ARM64 Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-studio-deb-arm64
          path: |
            dist-deb/pack-studio_*_arm64.deb
            dist-deb/pack-studio_*_arm64.deb.sha256
          retention-days: 30
