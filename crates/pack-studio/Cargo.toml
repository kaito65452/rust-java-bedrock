[package]
name = "pack-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VS Code-inspired Resource Pack Artist Studio (Java + Bedrock) powered by rp-core/rp-io/rp-transforms/rp-java/rp-bedrock"

[features]
default = []
# Embed assets/vendor/blockbench-web.tar.zst directly inside the binary using include_bytes!
embed-blockbench = []
# Enable native OS WebView host via wry + tao (requires WebKitGTK 4.1 on Linux)
native-webview = ["dep:wry", "dep:tao"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
dirs = "6.0"
eframe.workspace = true
egui.workspace = true
egui_dock = "0.16"
egui_extras = "0.31"
fast_image_resize = "5.5"
glam = "0.30"
image = { workspace = true, features = ["tga", "jpeg", "webp"] }
notify = "8.2"
rfd.workspace = true
rp-bedrock.workspace = true
rp-core.workspace = true
rp-io.workspace = true
rp-java.workspace = true
rp-transforms.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tao = { version = "0.33", optional = true }
tar = "0.4"
uuid.workspace = true
wry = { version = "0.51", optional = true }
zip.workspace = true
zstd = "0.13"

[dev-dependencies]
tempfile.workspace = true
